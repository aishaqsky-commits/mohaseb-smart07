# CI — بوابة الجودة الإلزامية لكل دفع/طلب سحب
# تتطابق مع npm scripts المعتمدة في المستودع (بناء + اختبارات النواة + اختبارات API e2e)
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-accounting:
    name: core-accounting (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core-accounting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (root workspaces)
        run: npm ci --no-audit --no-fund
        working-directory: .
      - name: Type-check + build
        run: npm run build
      - name: Tests (unit + golden cases + fuzz)
        run: npx jest --ci

  api:
    name: apps/api (build + e2e)
    runs-on: ubuntu-latest
    needs: core-accounting # بوابة الجودة: لا يُبنى API إلا بعد نجاح النواة واختباراتها
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
      # 1) تثبيت الحزمة المشتركة @platform/core-accounting وتصديرها (dist/)
      #    قبل بناء الـ API — يعالج TS2307 "Cannot find module '@platform/core-accounting'"
      #    لأن حزم file: تُنسخ من القرص ولا تُبنى تلقائياً.
      - name: Install root workspace deps (core-accounting)
        run: npm ci --no-audit --no-fund
        working-directory: .
      - name: Build shared package (emit dist/ + type declarations)
        run: npm run build
        working-directory: packages/core-accounting
      # 2) تثبيت تبعيات الـ API — تشمل إعادة ربط symlink الحزمة المشتركة وتحضير native bindings
      - name: Install API dependencies
        run: npm ci --no-audit --no-fund
      - name: Re-link shared package against freshly built dist
        run: npm install --no-audit --no-fund
      - name: Ensure better-sqlite3 native binding is available to the API runtime
        run: npm rebuild better-sqlite3 || npm install better-sqlite3@^11.3.0 --no-save --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: E2E tests
        run: npm test
