# CI — بوابة الجودة الإلزامية لكل دفع/طلب سحب
# تتطابق مع npm scripts المعتمدة في المستودع (بناء + اختبارات النواة + اختبارات API e2e)
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-accounting:
    name: core-accounting (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core-accounting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (root workspaces)
        run: npm ci --no-audit --no-fund
        working-directory: .
      - name: Type-check + build
        run: npm run build
      - name: Tests (unit + golden cases + fuzz)
        run: npx jest --ci

  api:
    name: apps/api (build + e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: E2E tests
        run: npm test
